<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Embed test v2 - YouTube mosquito Short</title></head><body style="margin:0;background:#111;color:#fff;font-family:sans-serif;">
<div style="width:100%;max-width:100%;position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;">
  <iframe id="yt" title="YouTube video player" style="width:100%;height:100%;border:0;"
    src="https://www.youtube.com/embed/47xR22cb2eY?autoplay=1&mute=1&playsinline=1&controls=1&rel=0"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <button id="sound-button" type="button" style="position:absolute;bottom:15px;left:50%;transform:translateX(-50%);z-index:10;padding:10px 16px;background:rgba(0,0,0,.8);color:white;border:0;border-radius:6px;cursor:pointer;">🔊 Tap to Unmute</button>
</div>
<p id="status" style="padding:12px;font-size:15px;line-height:1.5;">⏳ Loading YouTube Short “When a mosquito finds you at 2am”… — v2 uses a plain YouTube embed (no YouTube API). If the video plays muted, tap 🔊 for sound. If it stays black, screenshot this page.</p>
<script>
(function () {
  var iframe = document.getElementById("yt");
  var button = document.getElementById("sound-button");
  var statusEl = document.getElementById("status");
  button.addEventListener("click", function () {
    // Unmute by reloading the same video unmuted (plain embed has no API to unmute).
    iframe.src = "https://www.youtube.com/embed/47xR22cb2eY?autoplay=1&mute=0&playsinline=1&controls=1&rel=0";
    button.style.display = "none";
    statusEl.textContent = "🔊 Reloaded with sound — video should now play with audio.";
  });
  iframe.addEventListener("load", function () {
    statusEl.textContent = "✅ YouTube frame loaded — video should be playing muted. Tap 🔊 for sound.";
  });
  setTimeout(function () {
    if (button.style.display !== "none") { statusEl.textContent += " (Still black after 15s? Screenshot this page — the embed itself loaded, so it is a playback block on this phone/browser.)"; }
  }, 15000);
})();
</script>
</body></html>
